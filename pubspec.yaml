name: aurovilletv
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  provider: ^6.1.2
  equatable: ^2.0.8  

  # Dependency injection
  get_it: ^9.2.1

  # Networking
  dio: ^5.9.2

  # Utilities
  intl: ^0.20.3
  connectivity_plus: ^7.2.0
  shared_preferences: any
  shared_preferences_android: any
  flutter_secure_storage: ^11.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.1.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.0

  # File system
  path: ^1.9.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0

  # UI
  shimmer: ^3.0.0
  flutter_dotenv: ^6.0.1
  video_player: ^2.9.2
  cupertino_icons: ^1.0.8

  # Database
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/thumb.png
    - .env
